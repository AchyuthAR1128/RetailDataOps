[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# =============================================================================
# Project metadata
# =============================================================================
[project]
name = "retaildataops"
version = "0.1.0"
description = "Orchestrated Retail Data Engineering & Analytics Platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "RetailDataOps Team" }]

# Runtime dependencies — none yet (Phase 1 is scaffolding only)
dependencies = [
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyspark>=3.5.0,<4.0.0",
    "delta-spark>=3.0.0,<3.5.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
    "pip-audit>=2.7",
]

# =============================================================================
# Tool configuration
# =============================================================================

# -- Ruff (linter + import sorter) -------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["retaildataops"]

# -- Black (formatter) -------------------------------------------------------
[tool.black]
target-version = ["py310"]
line-length = 88

# -- Mypy (type checker) -----------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["pyspark.*", "delta.*"]
ignore_missing_imports = true

# -- Pytest -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=retaildataops --cov-report=term-missing -v"

# -- Hatch (build) ------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/retaildataops"]
